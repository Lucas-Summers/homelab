---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: think2
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-media
          image: busybox:1.36
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ "$(stat -c %d /data)" = "$(stat -c %d /host-mnt)" ]; then
                echo 'Media SSD is not mounted on think2; refusing to use the system disk' >&2
                exit 1
              fi
              mkdir -p /data/media/movies /data/media/tv /data/torrents/movies /data/torrents/tv
              chown -R 1000:1000 /data/media /data/torrents
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: media
              mountPath: /data
            - name: host-mnt
              mountPath: /host-mnt
              readOnly: true
      containers:
        - name: jellyfin
          image: ghcr.io/jellyfin/jellyfin:12.4
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: https://tv.${SECRET_DOMAIN}
          ports:
            - name: http
              containerPort: 8096
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /data
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          emptyDir:
            sizeLimit: 10Gi
        - name: media
          hostPath:
            path: /var/mnt/media
            type: Directory
        - name: host-mnt
          hostPath:
            path: /var/mnt
            type: Directory
