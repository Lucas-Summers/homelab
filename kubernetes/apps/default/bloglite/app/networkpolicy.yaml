---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bloglite
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bloglite
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/name: envoy
      ports:
        - protocol: TCP
          port: 3000
