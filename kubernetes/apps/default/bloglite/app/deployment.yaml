---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bloglite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bloglite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bloglite
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bloglite
          image: zot.huijzer.xyz/bloglite:3
          env:
            - name: BLOGLITE_USERNAME
              value: lucas
            - name: BLOGLITE_DOMAIN
              value: blog.${SECRET_DOMAIN}
            - name: BLOGLITE_PRODUCTION
              value: "true"
            - name: BLOGLITE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bloglite-secret
                  key: BLOGLITE_PASSWORD
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bloglite
