---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-ops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: job-ops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: job-ops
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: job-ops
          image: ghcr.io/dakheera47/job-ops:v0.14.0
          env:
            - name: JOBOPS_DISABLE_ANALYTICS
              value: "true"
            - name: SSO_REDIRECT_BASE_URL
              value: https://jobs.${SECRET_DOMAIN}
          ports:
            - name: http
              containerPort: 3001
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
              subPath: data
            - name: data
              mountPath: /app/codex-home
              subPath: codex-home
            - name: data
              mountPath: /root/.cache/Tectonic
              subPath: tectonic-cache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: job-ops
