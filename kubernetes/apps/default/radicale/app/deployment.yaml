---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radicale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radicale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radicale
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: radicale
          image: ghcr.io/kozea/radicale:3.9.0
          ports:
            - name: http
              containerPort: 5232
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/radicale/config
              subPath: config
              readOnly: true
            - name: auth
              mountPath: /run/radicale-auth
              readOnly: true
            - name: data
              mountPath: /var/lib/radicale
      volumes:
        - name: config
          configMap:
            name: radicale-config
        - name: auth
          secret:
            secretName: radicale-auth
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: radicale
