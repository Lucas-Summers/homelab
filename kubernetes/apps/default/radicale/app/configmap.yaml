---
apiVersion: v1
kind: ConfigMap
metadata:
  name: radicale-config
data:
  config: |
    [server]
    hosts = 0.0.0.0:5232

    [auth]
    type = htpasswd
    htpasswd_filename = /run/radicale-auth/users
    htpasswd_encryption = autodetect

    [rights]
    type = owner_only

    [storage]
    filesystem_folder = /var/lib/radicale/collections
    folder_umask = 0077
