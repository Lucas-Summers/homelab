---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lazylibrarian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lazylibrarian
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lazylibrarian
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: think2
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: prepare-books
          image: busybox:1.36
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ "$(stat -c %d /data)" = "$(stat -c %d /host-mnt)" ]; then
                echo 'Media SSD is not mounted on think2; refusing to use the system disk' >&2
                exit 1
              fi
              mkdir -p /data/media/books /data/media/audiobooks /data/torrents/books
              chown 1000:1000 /data/media/books /data/media/audiobooks /data/torrents/books
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: media
              mountPath: /data
            - name: host-mnt
              mountPath: /host-mnt
              readOnly: true
      containers:
        - name: lazylibrarian
          image: lscr.io/linuxserver/lazylibrarian:228abd29-ls390
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: UTC
          ports:
            - name: http
              containerPort: 5299
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lazylibrarian-config
        - name: media
          hostPath:
            path: /var/mnt/media
            type: Directory
        - name: host-mnt
          hostPath:
            path: /var/mnt
            type: Directory
