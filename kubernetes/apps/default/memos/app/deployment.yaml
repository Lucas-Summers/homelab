---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: memos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memos
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: memos
          image: neosmemo/memos:0.31.0
          env:
            - name: MEMOS_PORT
              value: "5230"
            - name: MEMOS_INSTANCE_URL
              value: https://notes.${SECRET_DOMAIN}
          ports:
            - name: http
              containerPort: 5230
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/opt/memos
            - name: settings
              mountPath: /etc/secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: memos
        - name: settings
          configMap:
            name: memos-settings
