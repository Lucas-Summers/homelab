---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: readarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: readarr
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: think2
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-books
          image: busybox:1.36
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ "$(stat -c %d /data)" = "$(stat -c %d /host-mnt)" ]; then
                echo 'Media SSD is not mounted on think2; refusing to use the system disk' >&2
                exit 1
              fi
              mkdir -p /data/media/books /data/torrents/books
              chown 1000:1000 /data/media/books /data/torrents/books
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: media
              mountPath: /data
            - name: host-mnt
              mountPath: /host-mnt
              readOnly: true
      containers:
        - name: readarr
          image: ghcr.io/faustvii/readarr:0.10.0
          ports:
            - name: http
              containerPort: 8787
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: readarr-config
        - name: media
          hostPath:
            path: /var/mnt/media
            type: Directory
        - name: host-mnt
          hostPath:
            path: /var/mnt
            type: Directory
