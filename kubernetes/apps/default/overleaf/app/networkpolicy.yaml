---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: overleaf
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: overleaf
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/name: envoy
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: overleaf-mongo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: overleaf-mongo
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: overleaf
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: overleaf-mongo
      ports:
        - protocol: TCP
          port: 27017
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: overleaf-redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: overleaf-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: overleaf
      ports:
        - protocol: TCP
          port: 6379
