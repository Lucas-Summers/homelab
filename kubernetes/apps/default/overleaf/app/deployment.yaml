---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overleaf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: overleaf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: overleaf
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init-mongo-replica-set
          image: mongo:8.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              i=0
              until mongosh 'mongodb://overleaf-mongo-0.overleaf-mongo.default.svc.cluster.local:27017/admin?directConnection=true' --quiet --eval '
                try {
                  if (rs.status().myState !== 1) quit(1)
                } catch (e) {
                  if (e.codeName !== "NotYetInitialized") throw e
                  rs.initiate({ _id: "overleaf", members: [{ _id: 0, host: "overleaf-mongo-0.overleaf-mongo.default.svc.cluster.local:27017" }] })
                  quit(1)
                }
              '; do
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then
                  echo 'MongoDB replica set did not become primary' >&2
                  exit 1
                fi
                sleep 5
              done
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      containers:
        - name: overleaf
          image: sharelatex/sharelatex:6.3.1
          env:
            - name: OVERLEAF_APP_NAME
              value: Overleaf
            - name: OVERLEAF_SITE_URL
              value: https://docs.${SECRET_DOMAIN}
            - name: OVERLEAF_BEHIND_PROXY
              value: "true"
            - name: OVERLEAF_SECURE_COOKIE
              value: "true"
            - name: OVERLEAF_MONGO_URL
              value: mongodb://overleaf-mongo-0.overleaf-mongo.default.svc.cluster.local:27017/sharelatex?replicaSet=overleaf
            - name: OVERLEAF_REDIS_HOST
              value: overleaf-redis
            - name: REDIS_HOST
              value: overleaf-redis
            - name: REDIS_PORT
              value: "6379"
            - name: V1_HISTORY_URL
              value: http://127.0.0.1:3100/api
            - name: OVERLEAF_INVITE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: overleaf-secret
                  key: OVERLEAF_INVITE_TOKEN_SECRET
            - name: ENABLED_LINKED_FILE_TYPES
              value: project_file,project_output_file
            - name: ENABLE_CONVERSIONS
              value: "true"
            - name: EMAIL_CONFIRMATION_DISABLED
              value: "true"
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/overleaf
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: overleaf
