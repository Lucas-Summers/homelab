---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: secret-key
          image: codeberg.org/forgejo/forgejo:17.0.0-rootless
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ ! -s /var/lib/gitea/secret_key ]; then
                if [ -e /var/lib/gitea/custom/conf/app.ini ]; then
                  echo "Forgejo config exists but secret_key is missing; restore the original key from backup" >&2
                  exit 1
                fi
                (umask 077; /app/gitea/gitea generate secret SECRET_KEY > /var/lib/gitea/secret_key)
              fi
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:17.0.0-rootless
          env:
            - name: FORGEJO__server__ROOT_URL
              value: https://git.${SECRET_DOMAIN}/
            - name: FORGEJO__server__DOMAIN
              value: git.${SECRET_DOMAIN}
            - name: FORGEJO__server__DISABLE_SSH
              value: "false"
            - name: FORGEJO__server__START_SSH_SERVER
              value: "true"
            - name: FORGEJO__server__SSH_DOMAIN
              value: git.${SECRET_DOMAIN}
            - name: FORGEJO__server__SSH_PORT
              value: "2222"
            - name: FORGEJO__server__SSH_LISTEN_PORT
              value: "2222"
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__security__SECRET_KEY_URI
              value: file:/var/lib/gitea/secret_key
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__service__REQUIRE_SIGNIN_VIEW
              value: "true"
            - name: FORGEJO__repository__DEFAULT_PRIVATE
              value: private
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 2222
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo
