---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: securo-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: securo-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: securo-backend
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: migrate
          image: ghcr.io/securo-finance/securo-backend:0.16.6
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: securo-backend-config
            - secretRef:
                name: securo-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      containers:
        - name: api
          image: ghcr.io/securo-finance/securo-backend:0.16.6
          envFrom:
            - configMapRef:
                name: securo-backend-config
            - secretRef:
                name: securo-secret
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /api/setup/status
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/setup/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: attachments
              mountPath: /app/data/attachments
        - name: worker
          image: ghcr.io/securo-finance/securo-backend:0.16.6
          command: ["celery", "-A", "app.worker", "worker", "--loglevel=info", "--concurrency=2"]
          envFrom:
            - configMapRef:
                name: securo-backend-config
            - secretRef:
                name: securo-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: attachments
              mountPath: /app/data/attachments
        - name: beat
          image: ghcr.io/securo-finance/securo-backend:0.16.6
          command:
            [
              "celery",
              "-A",
              "app.worker",
              "beat",
              "--loglevel=info",
              "--schedule=/var/lib/celery/celerybeat-schedule",
            ]
          envFrom:
            - configMapRef:
                name: securo-backend-config
            - secretRef:
                name: securo-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: beat-state
              mountPath: /var/lib/celery
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: securo-attachments
        - name: beat-state
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: securo-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: securo-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: securo-frontend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: frontend
          image: ghcr.io/securo-finance/securo-frontend:0.16.6
          env:
            - name: BACKEND_URL
              value: http://securo-backend:8000
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
