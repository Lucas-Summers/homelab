---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: securo
spec:
  hostnames:
    - finance.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: securo-backend
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: securo-frontend
          port: 8080
