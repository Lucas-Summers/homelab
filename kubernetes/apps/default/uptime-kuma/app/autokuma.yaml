---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autokuma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: autokuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autokuma
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: autokuma
          image: ghcr.io/bigboot/autokuma:2.0.0
          env:
            - name: AUTOKUMA__KUMA__URL
              value: http://uptime-kuma.default.svc.cluster.local:3001
            - name: AUTOKUMA__KUMA__USERNAME
              value: lucas
            - name: AUTOKUMA__KUMA__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-secret
                  key: PASSWORD
            - name: AUTOKUMA__STATIC_MONITORS
              value: /monitors
            - name: AUTOKUMA__FILES__ENABLED
              value: "true"
            - name: AUTOKUMA__FILES__FOLLOW_SYMLINKS
              value: "true"
            - name: AUTOKUMA__DOCKER__ENABLED
              value: "false"
            - name: AUTOKUMA__KUBERNETES__ENABLED
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: monitors
              mountPath: /monitors
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: autokuma
        - name: monitors
          configMap:
            name: uptime-kuma-monitors
