---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cli-proxy-api
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cli-proxy-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cli-proxy-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cli-proxy-api
          image: eceasy/cli-proxy-api:v8.0.33
          command:
            - /CLIProxyAPI/CLIProxyAPI
          args:
            - --config
            - /CLIProxyAPI/config/config.yaml
          ports:
            - name: http
              containerPort: 8317
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /CLIProxyAPI/config
              readOnly: true
            - name: auth
              mountPath: /root/.cli-proxy-api
      volumes:
        - name: config
          secret:
            secretName: cli-proxy-api-secret
            defaultMode: 0400
            items:
              - key: config.yaml
                path: config.yaml
        - name: auth
          persistentVolumeClaim:
            claimName: cli-proxy-api
