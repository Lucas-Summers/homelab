---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cli-proxy-api
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cli-proxy-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-webui
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: reactive-resume
      ports:
        - protocol: TCP
          port: 8317
