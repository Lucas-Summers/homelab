---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: miniflux
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miniflux
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: miniflux
          image: miniflux/miniflux:2.3.4
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: miniflux-secret
                  key: DATABASE_URL
            - name: RUN_MIGRATIONS
              value: "1"
            - name: CREATE_ADMIN
              value: "1"
            - name: ADMIN_USERNAME
              value: lucas
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miniflux-secret
                  key: ADMIN_PASSWORD
            - name: BASE_URL
              value: https://feed.${SECRET_DOMAIN}
            - name: HTTPS
              value: "1"
            - name: LISTEN_ADDR
              value: 0.0.0.0:8080
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            exec:
              command: ["/usr/bin/miniflux", "-healthcheck", "auto"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/usr/bin/miniflux", "-healthcheck", "auto"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
