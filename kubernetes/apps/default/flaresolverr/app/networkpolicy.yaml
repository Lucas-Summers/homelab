---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flaresolverr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prowlarr
      ports:
        - protocol: TCP
          port: 8191
