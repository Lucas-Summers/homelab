---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: default
data:
  settings.yaml: |-
    title: Homelab
    color: slate
    layout:
      Apps:
        style: row
        columns: 3
      Infra:
        style: row
        columns: 4
      Media:
        style: row
        columns: 3
  services.yaml: |-
    - Apps:
        - SearXNG:
            icon: searxng.svg
            href: https://search.${SECRET_DOMAIN}
            description: Private search
        - Open WebUI:
            icon: open-webui.svg
            href: https://chat.${SECRET_DOMAIN}
            description: AI chat
        - Memos:
            icon: memos.svg
            href: https://notes.${SECRET_DOMAIN}
            description: Private notes
        - Forgejo:
            icon: forgejo.svg
            href: https://git.${SECRET_DOMAIN}
            description: Git hosting
        - Miniflux:
            icon: miniflux.svg
            href: https://feed.${SECRET_DOMAIN}
            description: RSS reader
        - Overleaf:
            icon: overleaf.svg
            href: https://docs.${SECRET_DOMAIN}
            description: LaTeX editor
        - Pi-hole:
            icon: pi-hole.svg
            href: https://dns.${SECRET_DOMAIN}
            description: DNS and ad blocking
        - Bloglite:
            icon: mdi-post-outline
            href: https://blog.${SECRET_DOMAIN}
            description: Blog and notes
    - Infra:
        - Longhorn:
            icon: longhorn.svg
            href: https://storage.${SECRET_DOMAIN}
            description: Storage management
        - Router:
            icon: mdi-router-wireless
            href: https://network.${SECRET_DOMAIN}
            description: Router administration
        - Echo:
            icon: mdi-bullhorn-outline
            href: https://echo.${SECRET_DOMAIN}
            description: Test service
        - Cloudflare:
            icon: cloudflare.svg
            href: https://dash.cloudflare.com/
            description: DNS and tunnels
        - Uptime Kuma:
            icon: uptime-kuma.svg
            href: https://status.${SECRET_DOMAIN}
            description: Service monitoring
    - Media:
        - Coming soon:
            description: No media apps yet
  bookmarks.yaml: "[]"
  widgets.yaml: "[]"
  kubernetes.yaml: ""
  docker.yaml: ""
  custom.css: |-
    /* Catppuccin Latte (light) and Mocha (dark). Homepage expects RGB channels. */
    html.light {
      --color-50: 239 241 245;
      --color-100: 230 233 239;
      --color-200: 220 224 232;
      --color-300: 204 208 218;
      --color-400: 156 160 176;
      --color-500: 108 111 133;
      --color-600: 92 95 119;
      --color-700: 76 79 105;
      --color-800: 76 79 105;
      --color-900: 60 64 82;
      --color-logo-start: 114 135 253;
      --color-logo-stop: 30 102 245;
      --bg-color: var(--color-50);
    }

    html.dark {
      --color-50: 245 224 220;
      --color-100: 205 214 244;
      --color-200: 205 214 244;
      --color-300: 186 194 222;
      --color-400: 166 173 200;
      --color-500: 147 153 178;
      --color-600: 108 112 134;
      --color-700: 69 71 90;
      --color-800: 30 30 46;
      --color-900: 17 17 27;
      --color-logo-start: 180 190 254;
      --color-logo-stop: 137 180 250;
      --bg-color: var(--color-800);
    }
  custom.js: ""
