---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: website-content
    files:
      - index.html
      - favicon.png
      - terminal.txt
  - name: website-nginx
    files:
      - default.conf
resources:
  - ./deployment.yaml
  - ./service.yaml
  - ./httproute.yaml
  - ./networkpolicy.yaml
