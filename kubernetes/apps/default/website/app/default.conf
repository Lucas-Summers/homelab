map $http_user_agent $homepage {
    default /index.html;
    ~*^curl/ /terminal.ansi;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Vary "User-Agent" always;

    location = / {
        rewrite ^ $homepage last;
    }

    location = /terminal.ansi {
        default_type text/plain;
        charset utf-8;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
