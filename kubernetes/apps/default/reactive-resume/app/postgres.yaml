---
apiVersion: v1
kind: Service
metadata:
  name: reactive-resume-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: reactive-resume-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: reactive-resume-postgres
spec:
  serviceName: reactive-resume-postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: reactive-resume-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reactive-resume-postgres
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17.10
          env:
            - name: POSTGRES_USER
              value: reactive_resume
            - name: POSTGRES_DB
              value: reactive_resume
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command:
                ["pg_isready", "-h", "127.0.0.1", "-U", "reactive_resume", "-d", "reactive_resume"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                ["pg_isready", "-h", "127.0.0.1", "-U", "reactive_resume", "-d", "reactive_resume"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                ["pg_isready", "-h", "127.0.0.1", "-U", "reactive_resume", "-d", "reactive_resume"]
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
